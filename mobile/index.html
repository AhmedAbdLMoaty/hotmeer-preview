<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Home (mobile) — Hotmeer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--paper:#F6F5F3}
*{box-sizing:border-box}
body{margin:0;padding-top:var(--bar-h);background:var(--paper)}

:root{--bar-h:46px}
.rvbar{position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:9999;
  background:#0C0E10;border-bottom:1px solid rgba(255,255,255,.16);
  display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rvbar::-webkit-scrollbar{display:none}
.rvbar-tag{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;gap:1px;
  padding:0 18px 0 20px;border-right:1px solid rgba(255,255,255,.16);height:100%}
.rvbar-tag b{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:#fff;font-weight:600}
.rvbar-tag span{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;
  color:rgba(255,255,255,.48)}
.rvbar-nav{flex:0 0 auto;display:flex;align-items:stretch;height:100%}
.rvbar-nav a{display:flex;align-items:center;padding:0 15px;height:100%;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:rgba(255,255,255,.62);text-decoration:none;white-space:nowrap;
  border-bottom:2px solid transparent}
.rvbar-nav a:hover{color:#fff;background:rgba(255,255,255,.06);text-decoration:none}
.rvbar-nav a[aria-current]{color:#fff;border-bottom-color:#5C7BD9}
.rvbar-nav a:focus-visible{outline:2px solid #5C7BD9;outline-offset:-3px}
.rvbar-sep{flex:0 0 auto;align-self:center;width:1px;height:20px;
  background:rgba(255,255,255,.20);margin:0 6px}
.rvbar-note{flex:0 0 auto;margin-left:auto;padding:0 20px 0 24px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;
  color:rgba(255,255,255,.42);white-space:nowrap}
@media (max-width:1180px){.rvbar-note{display:none}}

.sheet{width:100%;max-width:390px;margin:0 auto;background:#fff}
.sheet img{width:100%;display:block}
.sheet .clip{overflow:hidden}
</style>
</head>
<body>
<div class="rvbar"><div class="rvbar-tag"><b>Hotmeer</b><span>Design preview</span></div><div class="rvbar-nav"><a href="../">Home</a><a href="../projects/">Projects</a><a href="../project-detail/">Project detail</a><a href="../after-sales/">After-sales</a><a href="../emergency/">Emergency takeover</a><a href="../for-manufacturers/">For manufacturers</a><a href="../ce-responsibility/">CE responsibility</a><a href="../fleet-report/">Fleet report</a><a href="../contact/">Contact</a></div><div class="rvbar-sep"></div><div class="rvbar-nav"><a href="../mobile/" aria-current="page">Home (mobile)</a><a href="../design-system/">Design system</a></div><div class="rvbar-note">Home is the live build · other pages are static design renders</div></div>
<div class="sheet">
<img src="../assets/MainMobile1.png" alt="Home (mobile)">
<img src="../assets/MainMobile2.png" alt="Home (mobile)">
</div>
</body>
</html>
