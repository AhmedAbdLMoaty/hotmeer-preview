<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Design system — Hotmeer</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F6F5F3}
.sheet{width:100%;max-width:1440px;margin:0 auto;background:#fff}
.sheet img{width:100%;display:block}
.plate{position:relative}
.clip{overflow:hidden}
.hs{position:absolute;display:block;border-radius:2px;
  transition:background-color .12s ease}
.hs:hover{background:rgba(36,67,156,.11)}
.hs:focus-visible{outline:2px solid #24439C;outline-offset:1px}
.logopatch{position:absolute;background:#fff}
.sheet .logofix{position:absolute;display:block}
.sheet .logofix img{width:auto;height:100%;display:block}
</style>
</head>
<body>
<div class="sheet">
<img src="../assets/System1.png" alt="Design system">
<img src="../assets/System2.png" alt="Design system">
</div>
</body>
</html>
